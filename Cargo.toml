[package]
name = "rsille"
version = "3.0.0"
edition = "2021"
authors = ["nidhoggfgg <nidhoggfgg@gmail.com>"]
description = "Terminal application framework with Unicode text, layout, animation and sample-based graphics"
keywords = ["braille", "terminal", "tui", "cli", "animation"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/nidhoggfgg/rsille.git"
include = ["src/**", "examples/basic_canvas.rs", "README*", "MIGRATION_V3.md", "LICENCE", "Cargo.toml"]

[dependencies]
crossterm = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
rayon = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
log = { workspace = true }
taffy = { workspace = true }
syntect = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }
rustc-hash = "2.0"
smallvec = "1.13"

[features]
default = []
syntax-highlighting = ["dep:syntect", "dep:once_cell"]

[workspace]
members = ["packages/canvas", "packages/render", "packages/tui"]
resolver = "3"
exclude = ["examples"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
rayon = "1.10.0"
unicode-width = "0.2.0"
unicode-segmentation = "1.12"
crossterm = { version = "0.28.1", features = ["event-stream"] }
async-trait = "0.1.84"
futures = "0.3.31"
taffy = "0.9.1"
log = "0.4.28"
syntect = { version = "5.3", default-features = false, features = [
    "default-fancy",
] }
once_cell = "1.20"

[profile.release]
lto = true
# debug = true # only used for perf
