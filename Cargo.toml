[package]
name = "rsille"
version = "3.0.4"
edition = "2021"
authors = ["nidhoggfgg <nidhoggfgg@gmail.com>"]
description = "Terminal application framework with Unicode text, layout, animation and sample-based graphics"
keywords = ["braille", "terminal", "tui", "cli", "animation"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/nidhoggfgg/rsille.git"
include = ["src/**", "examples/basic_canvas.rs", "examples/sixel_windows.rs", "docs/raster.md", "docs/raster-design.md", "docs/raster-performance.md", "/README.md", "/README_cn.md", "LICENCE", "Cargo.toml"]

[dependencies]
crossterm = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
log = { workspace = true }
taffy = { workspace = true }
syntect = { workspace = true, optional = true }
rustc-hash = "2.0"
smallvec = "1.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
syntax-highlighting = ["dep:syntect"]
sixel = []

[workspace]
members = ["packages/canvas", "packages/render", "packages/tui"]
resolver = "3"
exclude = ["examples"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
unicode-width = "0.2.0"
unicode-segmentation = "1.12"
crossterm = { version = "0.28.1", features = ["event-stream"] }
futures = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }
taffy = "0.9.1"
log = "0.4.28"
syntect = { version = "5.3", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
] }

[profile.release]
lto = true
# debug = true # only used for perf
