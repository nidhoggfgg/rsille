[package]
name = "rsille"
version = "3.4.2"
edition = "2021"
authors = ["nidhoggfgg <nidhoggfgg@gmail.com>"]
description = "A terminal UI framework with widgets, layouts, animation, and Unicode, Sixel, and Kitty graphics"
keywords = ["terminal", "tui", "graphics", "animation", "braille"]
categories = ["command-line-interface", "graphics"]
readme = "README.md"
license = "MIT"
homepage = "https://rsille.vercel.app"
repository = "https://github.com/nidhoggfgg/rsille.git"
include = ["src/**", "/README.md", "/README_cn.md", "LICENCE", "Cargo.toml"]

[dependencies]
rsille-render.workspace = true
rsille-canvas.workspace = true
rsille-tui.workspace = true
rsille-overlay = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true

[features]
default = ["raster"]
raster = ["rsille-render/raster", "rsille-tui/raster"]
# Draw graphics and widgets over a live shell session (Unix PTYs or Windows ConPTY).
overlay = ["dep:rsille-overlay", "raster"]

[workspace]
members = [
    "packages/rsille-canvas",
    "packages/rsille-render",
    "packages/rsille-tui",
    "packages/rsille-overlay",
    "packages/rsille-typst",
    "packages/rsille-syntect",
    "packages/rsille-playground",
]
resolver = "3"
exclude = ["examples"]

[workspace.dependencies]
rsille-render = { version = "0.1.3", path = "packages/rsille-render", default-features = false }
rsille-canvas = { version = "0.1.0", path = "packages/rsille-canvas" }
rsille-tui = { version = "0.1.0", path = "packages/rsille-tui", default-features = false }
rsille-overlay = { version = "0.1.2", path = "packages/rsille-overlay" }
base64 = "0.22"
crossterm = { version = "0.28.1", features = ["event-stream"] }
futures = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }
libc = "0.2"
log = "0.4.28"
rustc-hash = "2.0"
smallvec = "1.13"
taffy = "0.9.1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
unicode-segmentation = "1.12"
unicode-width = "0.2.0"

[profile.release]
lto = true
# debug = true # only used for perf
