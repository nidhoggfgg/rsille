[package]
name = "deepseek-pet"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rsille = { path = "../..", features = ["kitty"] }

[target.'cfg(unix)'.dependencies]
serde = { version = "1", features = ["derive"] }
yaml_serde = "0.10"
fastrand = "2"
libc = "0.2"
png = "0.18"
tempfile = "3"
vt100 = "0.18.1"

[build-dependencies]
yaml_serde = "0.10"
png = "0.18"
