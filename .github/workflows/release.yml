name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release version and main ancestry
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'tag and package version differ'
          assert Path(f'releases/{version}.md').is_file(), 'release notes are missing'
          PY
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Check formatting and workspace
        run: |
          cargo fmt -p rsille -p rsille-render -p rsille-canvas -p rsille-tui -p rsille-typst -p rsille-syntect --check
          cargo test --workspace --exclude rsille-playground --all-features
          cargo check --workspace --exclude rsille-playground --all-targets --all-features

      - name: Check API documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc -p rsille -p rsille-render -p rsille-canvas -p rsille-tui --no-default-features --no-deps
          cargo doc -p rsille -p rsille-render -p rsille-canvas -p rsille-tui --all-features --no-deps

      - name: Verify package and independent consumers
        run: python3 scripts/check-release.py

      - name: Check terminal restoration
        run: python3 scripts/check-terminal.py

      - name: Publish to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          packages=()
          metadata=$(cargo metadata --no-deps --format-version 1)
          for name in rsille-render rsille-canvas rsille-tui rsille; do
            version=$(jq -er --arg name "$name" '.packages[] | select(.name == $name).version' <<< "$metadata")
            status=$(curl -sS --retry 3 -A "rsille release ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY)" \
              -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/$name/$version")
            case "$status" in
              200) echo "$name $version is already published" ;;
              404) packages+=(-p "$name") ;;
              *) echo "::error::Failed to check $name $version (HTTP $status)"; exit 1 ;;
            esac
          done
          if (( ${#packages[@]} )); then
            if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
              echo "::error::Set CARGO_REGISTRY_TOKEN to publish the missing core crates."
              exit 1
            fi
            cargo publish "${packages[@]}" --all-features --registry crates-io
          fi

      - name: Prepare release assets from crates.io
        shell: bash
        working-directory: target/package
        run: |
          version=${RELEASE_TAG#v}
          archive="rsille-$version.crate"
          # Workspace packaging can write a different Cargo.lock from the uploaded archive.
          # Fetch the published bytes on the first run as well as on retries.
          curl_flags=(-fsSL --retry 5 --retry-all-errors --retry-max-time 90
            -A "rsille release ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY)")
          checksum=$(curl "${curl_flags[@]}" "https://crates.io/api/v1/crates/rsille/$version" |
            jq -er '.version.checksum | select(test("^[0-9a-f]{64}$"))')
          curl "${curl_flags[@]}" "https://static.crates.io/crates/rsille/$archive" -o "$archive"
          echo "$checksum  $archive" > SHA256SUMS
          sha256sum -c SHA256SUMS
          tar -xzOf "$archive" "rsille-$version/.cargo_vcs_info.json" |
            jq -e --arg commit "$(git rev-parse HEAD)" '.git.sha1 == $commit and .git.dirty != true' >/dev/null ||
            { echo "::error::Published $archive does not match the release commit"; exit 1; }

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Listing releases also finds drafts left by interrupted uploads.
          release=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[]' | jq -sc --arg tag "$RELEASE_TAG" 'map(select(.tag_name == $tag)) |
              if length > 1 then error("multiple releases for the same tag") else .[0] end')
          if [[ "$release" == null ]]; then
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "rsille ${RELEASE_TAG#v}" --notes-file "releases/${RELEASE_TAG#v}.md"
          fi

          draft=$(jq -r 'if . == null then true else .draft end' <<< "$release")
          for file in "target/package/rsille-${RELEASE_TAG#v}.crate" target/package/SHA256SUMS; do
            name=${file##*/}
            asset=$(jq -c --arg name "$name" 'first(.assets[]? | select(.name == $name)) // null' <<< "$release")
            if [[ "$asset" == null ]]; then
              gh release upload "$RELEASE_TAG" "$file"
            elif [[ "$draft" == true && $(jq -r '.state' <<< "$asset") == starter ]]; then
              # GitHub can leave an empty starter asset after an interrupted upload.
              gh release upload "$RELEASE_TAG" "$file" --clobber
            else
              id=$(jq -er '.id' <<< "$asset")
              gh api "repos/$GH_REPO/releases/assets/$id" -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/existing-asset"
              cmp -s "$file" "$RUNNER_TEMP/existing-asset" ||
                { echo "::error::Existing release asset $name differs"; exit 1; }
            fi
          done
          if [[ "$draft" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
