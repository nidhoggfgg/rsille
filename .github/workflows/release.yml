name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release version and main ancestry
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'tag and package version differ'
          assert Path(f'releases/{version}.md').is_file(), 'release notes are missing'
          PY
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Check formatting and workspace
        run: |
          cargo fmt --all --check
          cargo test --workspace --all-features
          cargo check --workspace --all-targets --all-features

      - name: Check API documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc -p rsille --no-default-features --no-deps
          cargo doc -p rsille --all-features --no-deps

      - name: Verify package and independent consumers
        run: python3 scripts/check-release.py

      - name: Check terminal restoration
        run: python3 scripts/check-terminal.py

      - name: Write package checksum
        working-directory: target/package
        run: sha256sum "rsille-${RELEASE_TAG#v}.crate" > SHA256SUMS

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Set the CARGO_REGISTRY_TOKEN repository secret to a crates.io API token with publish access to rsille."
            exit 1
          fi
          cargo publish -p rsille --all-features --registry crates-io

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            "target/package/rsille-${RELEASE_TAG#v}.crate" \
            target/package/SHA256SUMS \
            --verify-tag \
            --title "rsille ${RELEASE_TAG#v}" \
            --notes-file "releases/${RELEASE_TAG#v}.md" \
            --latest
