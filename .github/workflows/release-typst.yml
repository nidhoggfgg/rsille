name: Release rsille-typst

on:
  push:
    tags:
      - 'rsille-typst-v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-typst-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release version and main ancestry
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          version = tomllib.loads(Path('packages/rsille-typst/Cargo.toml').read_text())['package']['version']
          assert os.environ['RELEASE_TAG'] == f'rsille-typst-v{version}', 'tag and package version differ'
          assert Path(f'releases/rsille-typst/{version}.md').is_file(), 'release notes are missing'
          PY
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      # This library workspace does not track Cargo.lock. Resolve once, then
      # keep the same dependency resolution throughout checks and publication.
      - name: Generate workspace lockfile
        run: cargo generate-lockfile

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-typst

      - name: Check formatting, tests and targets
        run: |
          cargo fmt -p rsille-typst -- --check
          cargo test -p rsille-typst --locked
          cargo check -p rsille-typst --all-targets --locked

      - name: Check API documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p rsille-typst --no-deps --locked

      - name: Verify archive against published dependencies
        run: python3 scripts/check-release-typst.py

      - name: Write package checksum
        working-directory: target/package
        run: sha256sum "rsille-typst-${RELEASE_TAG#rsille-typst-v}.crate" > SHA256SUMS-rsille-typst

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Set the CARGO_REGISTRY_TOKEN repository secret to a crates.io API token with publish access to rsille-typst."
            exit 1
          fi
          cargo publish -p rsille-typst --locked --registry crates-io

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            "target/package/rsille-typst-${RELEASE_TAG#rsille-typst-v}.crate" \
            target/package/SHA256SUMS-rsille-typst \
            --verify-tag \
            --title "rsille-typst ${RELEASE_TAG#rsille-typst-v}" \
            --notes-file "releases/rsille-typst/${RELEASE_TAG#rsille-typst-v}.md" \
            --latest=false
