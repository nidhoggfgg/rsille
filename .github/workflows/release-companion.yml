name: Release companion crate
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'rsille-playground-v[0-9]*.[0-9]*.[0-9]*'
      - 'rsille-syntect-v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_name }}

concurrency:
  group: release-companion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-crate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      package: ${{ steps.metadata.outputs.package }}
      version: ${{ steps.metadata.outputs.version }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release version, notes and main ancestry
        id: metadata
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          name, version = os.environ['RELEASE_TAG'].rsplit('-v', 1)
          assert name in ('rsille-playground', 'rsille-syntect')
          package = tomllib.loads(Path(f'packages/{name}/Cargo.toml').read_text())['package']
          assert (name, version) == (package['name'], package['version']), 'tag and package differ'
          assert Path(f'releases/{name}/{version}.md').is_file(), 'release notes are missing'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              print(f'PACKAGE={name}', file=env)
              print(f'VERSION={version}', file=env)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as outputs:
              print(f'package={name}', file=outputs)
              print(f'version={version}', file=outputs)
          PY
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ env.PACKAGE }}

      - name: Package the crate
        run: |
          cargo fmt -p "$PACKAGE" --check
          cargo generate-lockfile
          cargo package -p "$PACKAGE" --locked --no-verify --registry crates-io

      - name: Test the archive against published dependencies
        run: |
          archive="$PACKAGE-$VERSION"
          tar -xzf "target/package/${archive}.crate" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/$archive"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          cargo test --all-targets --locked
          if [[ "$PACKAGE" == rsille-playground ]]; then
            cargo install --path . --locked --debug --root "$RUNNER_TEMP/install"
            "$RUNNER_TEMP/install/bin/rsille" draw --headless
          else
            cargo test --doc --locked
          fi

      - name: Publish to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          status=$(curl -sS --retry 3 -A "rsille release ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY)" \
            -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/$PACKAGE/$VERSION")
          case "$status" in
            404) cargo publish -p "$PACKAGE" --locked --registry crates-io ;;
            200) echo "$PACKAGE $VERSION is already published" ;;
            *) echo "::error::Failed to check $PACKAGE $VERSION (HTTP $status)"; exit 1 ;;
          esac

  playground-binaries:
    needs: publish-crate
    if: needs.publish-crate.outputs.package == 'rsille-playground'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: rsille-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: rsille-linux-arm64
          - os: macos-15
            target: aarch64-apple-darwin
            asset: rsille-macos-apple-silicon
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: rsille-macos-intel
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            asset: rsille.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.publish-crate.outputs.version }}
      TARGET: ${{ matrix.target }}
      ASSET: ${{ matrix.asset }}
    steps:
      - name: Build and test the release executable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          cargo +stable install rsille-playground --version "=$VERSION" --locked --target "$TARGET" --root install
          mkdir dist
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp install/bin/rsille.exe "dist/$ASSET"
          else
            cp install/bin/rsille "dist/$ASSET"
          fi
          cd dist
          "./$ASSET" --help
          "./$ASSET" draw --headless

      - uses: actions/upload-artifact@v4
        with:
          name: playground-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: [publish-crate, playground-binaries]
    if: >-
      ${{ !cancelled() && needs.publish-crate.result == 'success' &&
          (needs.publish-crate.outputs.package == 'rsille-syntect' || needs.playground-binaries.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE: ${{ needs.publish-crate.outputs.package }}
      VERSION: ${{ needs.publish-crate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        if: env.PACKAGE == 'rsille-playground'
        with:
          pattern: playground-*
          path: target/package
          merge-multiple: true

      - name: Publish verified GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p target/package
          files=()
          if [[ "$PACKAGE" == rsille-playground ]]; then
            cp LICENCE target/package/
            files=(target/package/rsille-linux-{x64,arm64} target/package/rsille-macos-{intel,apple-silicon}
                   target/package/rsille.exe target/package/LICENCE)
          fi
          bash scripts/finish-github-release.sh "$PACKAGE" "$VERSION" \
            "releases/$PACKAGE/$VERSION.md" "SHA256SUMS-$PACKAGE" false "${files[@]}"

      - name: Refresh the Playground download site
        if: env.PACKAGE == 'rsille-playground'
        env:
          DEPLOY_HOOK: ${{ secrets.PLAYGROUND_VERCEL_DEPLOY_HOOK }}
        run: |
          if [[ -n "$DEPLOY_HOOK" ]]; then
            curl --fail --silent --show-error --retry 3 --max-time 30 \
              --request POST "$DEPLOY_HOOK" --output /dev/null
          else
            echo "Download site hook is not configured. Skipping refresh."
          fi
