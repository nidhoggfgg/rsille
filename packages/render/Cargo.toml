[package]
name = "render"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

description = "Terminal rendering engine for rsille"
repository = "https://github.com/nidhoggfgg/rsille.git"
readme = "README.md"

[lib]
name = "render"
doctest = false

[dependencies]
base64 = { workspace = true, optional = true }
crossterm = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
default = []
sixel = []
kitty = ["dep:base64"]

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }

[[bench]]
name = "buffer_bench"
harness = false
