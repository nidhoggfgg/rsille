[package]
name = "rsille-playground"
version = "0.1.3"
edition = "2021"
description = "An interactive playground for rsille terminal graphics"
license = "MIT"
homepage = "https://rsille.vercel.app/download"
repository = "https://github.com/nidhoggfgg/rsille"
readme = "README.md"
include = [
    "/Cargo.toml", "/README.md", "/build.rs", "/src/**", "/tests/**",
    "/ai-babies/assets/*.rgb", "/ai-babies/assets/*.rgba", "/ai-babies/assets/*-320x320.png",
    "/deepseek-pet/assets/animations/**", "/deepseek-pet/assets/commands.yaml",
]

[[bin]]
name = "rsille"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm.workspace = true
meval = "0.2"
png = "0.18"
rsille = { version = "3.4.0", path = "../..", features = ["raster"] }

[target.'cfg(any(unix, windows))'.dependencies]
fastrand = "2"
rsille-overlay.workspace = true
serde = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"
unifont = "1.1"
yaml_serde = "0.10"

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[dev-dependencies]
tempfile = "3"

[build-dependencies]
png = "0.18"
yaml_serde = "0.10"
