[package]
name = "rsille-playground"
version = "0.1.2"
edition = "2021"
description = "An interactive playground for rsille terminal graphics"
license = "MIT"
repository = "https://github.com/nidhoggfgg/rsille"
readme = "README.md"
include = [
    "/Cargo.toml", "/README.md", "/build.rs", "/src/**", "/tests/**",
    "/ai-babies/assets/*.rgb", "/ai-babies/assets/*.rgba", "/ai-babies/assets/*-320x320.png",
    "/deepseek-pet/assets/animations/**", "/deepseek-pet/assets/commands.yaml",
]

[[bin]]
name = "rsille"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm.workspace = true
meval = "0.2"
png = "0.18"
rsille = { version = "3.3.1", path = "../..", features = ["raster"] }

[target.'cfg(unix)'.dependencies]
fastrand = "2"
libc.workspace = true
serde = { version = "1", features = ["derive"] }
tempfile = "3"
unicode-normalization = "0.1"
unifont = "1.1"
vt100 = "0.18.1"
yaml_serde = "0.10"

[build-dependencies]
png = "0.18"
yaml_serde = "0.10"
