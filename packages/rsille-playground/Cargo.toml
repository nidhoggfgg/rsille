[package]
name = "rsille-playground"
version = "0.1.0"
edition = "2021"
description = "An interactive playground for rsille terminal graphics"
license = "MIT"
repository = "https://github.com/nidhoggfgg/rsille"
readme = "README.md"

[[bin]]
name = "rsille"
path = "src/main.rs"

[dependencies]
deepseek-pet = { path = "../../examples/deepseek-pet" }
ai-babies = { path = "../../examples/ai-babies", version = "0.1.0" }
rsille-function-plotter = { path = "../../examples/function-plotter", version = "0.1.0" }
rsille-jellyfish = { path = "../../examples/jellyfish", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
