[package]
name = "rsille-cli"
version = "0.1.0"
edition = "2021"
description = "Composable terminal interfaces for shell scripts, powered by rsille"
license = "MIT"
repository = "https://github.com/nidhoggfgg/rsille"
readme = "README.md"

[[bin]]
name = "rsille"
path = "src/main.rs"

[dependencies]
rsille = { path = "../..", version = "3.1.0", default-features = false }
crossterm = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
