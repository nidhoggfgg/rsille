[package]
name = "rsille-cli"
version = "0.1.0"
edition = "2021"
description = "Composable terminal interfaces for shell scripts, powered by rsille"
license = "MIT"
repository = "https://github.com/nidhoggfgg/rsille"
readme = "README.md"

[[bin]]
name = "rsille"
path = "src/main.rs"

[dependencies]
rsille = { path = "../..", version = "3.1.0", default-features = false, features = ["sixel"] }
rsille-typst = { path = "../rsille-typst", version = "0.1.0" }
typst-assets = { version = "=0.13.1", features = ["fonts"] }
crossterm = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
