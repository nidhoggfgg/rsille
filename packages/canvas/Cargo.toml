[package]
name = "canvas"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

description = "Sample canvas with Braille and Half-block encoding for rsille"
repository = "https://github.com/nidhoggfgg/rsille.git"
readme = "README.md"

[lib]
name = "canvas"
doctest = false

[dependencies]
render = { path = "../render" }
crossterm = { workspace = true }

[dev-dependencies]
criterion = "0.5.1"
rand = "0.8.5"

[[bench]]
name = "vec_vs_map"
harness = false

[[bench]]
name = "u8_vs_u32"
harness = false

[[bench]]
name = "line"
harness = false
